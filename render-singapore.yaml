# Render Blueprint for production: the same three parts as render.yaml, on paid
# plans in Singapore, close to Vietnam, so nothing sleeps between visitors.
# Render → New → Blueprint → this repository, Blueprint path "render-singapore.yaml".
# Costs about 20 USD a month (two Starter web services, one Basic database).
# Fill the values marked sync: false as DEPLOY.md describes, then redeploy the website.
databases:
  - name: hanoigo-db-sg
    plan: basic-256mb
    region: singapore
    databaseName: hanoigo
    user: hanoigo
    postgresMajorVersion: "16"

services:
  - type: web
    name: hanoigo-api-sg
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install .
    startCommand: bash start.sh
    healthCheckPath: /api/v1/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: hanoigo-db-sg
          property: connectionString
      - key: APP_ENV
        value: production
      - key: GENERATE_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: ROUTE_API_URL
        value: https://router.project-osrm.org
      - key: GEOCODING_API_URL
        value: https://nominatim.openstreetmap.org
      - key: GEOCODING_USER_AGENT
        value: HanoiGO/1.0 (https://github.com/longdeey/HanoiGO)
      # Every address the website is served from, comma separated, e.g.
      # https://hanoi-go.com,https://www.hanoi-go.com,https://hanoigo-web-sg.onrender.com
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: hanoigo-web-sg
    runtime: node
    plan: starter
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's address, e.g. https://api.hanoi-go.com (read at build time).
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_MAP_TILE_URL
        value: https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png
