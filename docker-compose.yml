services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: hanoigo
      POSTGRES_PASSWORD: hanoigo
      POSTGRES_DB: hanoigo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanoigo -d hanoigo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
