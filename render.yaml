# Render Blueprint: the API, the website and the database in one go.
# Render → New → Blueprint → pick this repository. After the first deploy, fill
# the two values marked sync: false with the URLs Render gives the services
# (see DEPLOY.md), then redeploy the website.
databases:
  - name: hanoigo-db
    plan: free
    databaseName: hanoigo
    user: hanoigo
    postgresMajorVersion: "16"

services:
  - type: web
    name: hanoigo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: bash start.sh
    healthCheckPath: /api/v1/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: hanoigo-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: GENERATE_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: ROUTE_API_URL
        value: https://router.project-osrm.org
      - key: GEOCODING_API_URL
        value: https://nominatim.openstreetmap.org
      - key: GEOCODING_USER_AGENT
        value: HanoiGO/1.0 (https://github.com/longdeey/HanoiGO)
      # The website's address, e.g. https://hanoigo-web.onrender.com (comma-separate several).
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: hanoigo-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's address, e.g. https://hanoigo-api.onrender.com (read at build time).
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_MAP_TILE_URL
        value: https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png
